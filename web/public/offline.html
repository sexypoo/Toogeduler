<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>오프라인 — Toogeduler</title>
    <!-- 서비스 워커가 네트워크 실패 시 보여주는 정적 안내 화면입니다. 로그인·API·외부 자원에 기대지 않습니다. -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px calc(64px + env(safe-area-inset-bottom));
        background: #ffffff;
        color: #141a26;
        font:
          400 14.5px/1.6 "Wanted Sans Variable",
          "Wanted Sans",
          Pretendard,
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
      }
      .mark {
        display: block;
        width: 76px;
        height: 56px;
      }
      .mark rect {
        mix-blend-mode: multiply;
        opacity: 0.85;
      }
      h1 {
        margin: 24px 0 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.3;
      }
      p {
        margin: 8px 0 0;
        color: #464e5d;
      }
      #status {
        margin-top: 8px;
        color: #d63a55;
        font-size: 13.5px;
        font-weight: 600;
      }
      #status:empty {
        display: none;
      }
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        padding: 0 17px;
        border: 0;
        border-radius: 8px;
        background: #141a26;
        color: #ffffff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #2b3242;
      }
      button:focus-visible {
        outline: 2px solid #1590c9;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- 두 사각형이 겹치지 않고 떨어져 있는 것은 "연결이 이어지지 않았다"는 뜻입니다. -->
      <svg class="mark" viewBox="0 0 76 56" aria-hidden="true">
        <rect x="0" y="0" width="36" height="36" rx="6" fill="#19a5d0" />
        <rect x="40" y="20" width="36" height="36" rx="6" fill="#e2497f" />
      </svg>
      <h1>오프라인이에요</h1>
      <p>인터넷에 연결되면 일정을 다시 불러올 수 있어요. 연결을 확인하고 다시 시도해 주세요.</p>
      <div id="status" role="status" aria-live="polite"></div>
      <button type="button" id="retry">다시 시도</button>
    </main>
    <script>
      var button = document.getElementById("retry");
      // 전역 status(window.status)와 겹치지 않게 notice 라는 이름을 씁니다.
      var notice = document.getElementById("status");
      // navigator.onLine 은 믿지 않고 실제로 요청을 보내 확인합니다.
      function retry() {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        button.textContent = "확인하는 중…";
        notice.textContent = "";
        fetch("/", { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("offline");
            location.reload();
          })
          .catch(function () {
            notice.textContent = "아직 연결되지 않았어요.";
            button.disabled = false;
            button.removeAttribute("aria-busy");
            button.textContent = "다시 시도";
          });
      }
      button.addEventListener("click", retry);
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: toogeduler
      POSTGRES_USER: toogeduler
      POSTGRES_PASSWORD: toogeduler
    ports:
      - "5432:5432"
    volumes:
      - toogeduler-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toogeduler"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  toogeduler-postgres:


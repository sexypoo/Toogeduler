spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/toogeduler}
    username: ${DATABASE_USERNAME:toogeduler}
    password: ${DATABASE_PASSWORD:toogeduler}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-secret}
            scope: [email, profile]
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: [profile_nickname, account_email]
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:toogeduler-local-secret-key-change-this-in-production-2026}
  web-url: ${WEB_URL:http://localhost:3000}
  seed-demo: ${SEED_DEMO:true}


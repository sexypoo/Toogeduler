spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/toogeduler}
    username: ${DATABASE_USERNAME:toogeduler}
    password: ${DATABASE_PASSWORD:toogeduler}
  jpa:
    hibernate:
      # 테이블 구조는 Flyway(db/migration/V*.sql)가 만든다. Hibernate 는 엔티티와 테이블이 맞는지 확인만 하고, 다르면 서버가 뜨지 않는다.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # 운영 DB처럼 테이블이 이미 있는 DB는 V1을 실행하지 않고 "V1 적용됨"으로 표시만 한다.
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-secret}
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: [email, profile]
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: [profile_nickname]
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${PORT:8080}
  # Railway 프록시가 붙여 주는 X-Forwarded-Proto/Host 를 믿어 https 주소로 리다이렉트한다.
  # 없으면 Spring 이 자기를 http 로 알고 OAuth 시작 리다이렉트가 한 번 http 로 내려가, 세션 쿠키가 평문으로 오간다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${JWT_SECRET:toogeduler-local-secret-key-change-this-in-production-2026}
  web-url: ${WEB_URL:http://localhost:3000}
  mobile-url: ${MOBILE_URL:toogeduler://auth/callback}
  seed-demo: ${SEED_DEMO:true}
  # 웹 푸시 발신자 키(VAPID). 비어 있으면 발송만 건너뛴다. 운영 키 등록은 #59.
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
